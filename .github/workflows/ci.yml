name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: mojian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run backend tests
        run: mvn -B test
        working-directory: mojian

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: mojian/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: mojian/web
      - name: Build frontend
        run: npm run build
        working-directory: mojian/web

  docker-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose -f mojian/docker-compose.yml config --quiet
      - name: Build backend image
        run: docker build -t mojian-backend .
        working-directory: mojian
      - name: Build frontend image
        run: docker build -t mojian-web ./web
        working-directory: mojian