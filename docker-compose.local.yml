# 本地快速 Docker 部署（无需等待 Maven 大镜像）
# 后端直接挂载本机已构建的 target/mojian.jar；web 由本目录 web/Dockerfile 构建
# 用法：mvn -DskipTests package && docker compose -f docker-compose.local.yml up -d --build

services:
  db:
    image: mysql:8.0
    container_name: mojian-local-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mojian}
      MYSQL_USER: ${MYSQL_USER:-mojian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mojian123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mojian-local-db-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: eclipse-temurin:17-jre
    container_name: mojian-local-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mojian}
      MYSQL_USERNAME: ${MYSQL_USER:-mojian}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mojian123}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MOCK: ${LLM_MOCK:-true}
      # 容器内固定 8080：application.yml 的 8081 仅为本机开发端口偏好
      SERVER_PORT: 8080
    volumes:
      - ./target/mojian.jar:/app/app.jar:ro
      # API Key 的加密密钥文件必须持久化，否则容器重建后旧密文解不开
      - mojian-local-secrets:/root/.mojian
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    ports:
      - "127.0.0.1:8081:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mojian-local-web
    depends_on:
      - backend
    ports:
      - "127.0.0.1:80:80"

volumes:
  mojian-local-db-data:
  mojian-local-secrets:
