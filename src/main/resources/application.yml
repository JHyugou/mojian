spring:
  application:
    name: mojian
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mojian}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

mojian:
  # 开发环境默认不依赖 Redis（内存实现 + 数据库唯一约束兜底），
  # 生产部署时设为 true 并配置 REDIS_HOST/REDIS_PORT
  redis:
    enabled: false
  llm:
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    # 显式启用 Mock；未配置 api-key 时也会自动使用 Mock
    mock: ${LLM_MOCK:false}
    connect-timeout-seconds: 10
    # 大提示词下部分模型的"首字延迟"可达数分钟且波动大（实测 glm-5.3-flash
    # 编码端点 3.5~9.5 分钟不等），该值同时是流式空闲看门狗阈值：
    # 太短会把"正在等首字"的任务误杀
    read-timeout-seconds: 900

logging:
  level:
    com.mojian: info
